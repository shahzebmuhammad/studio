<style id="sh-card-css">
html body .app-shell .detail-modal,html body .detail-modal{width:min(560px,100%)!important;padding:28px 30px!important;max-height:calc(100vh - 32px);overflow:auto}
html body .detail-modal h2{font-size:22px!important}
html body .detail-modal .module-eyebrow{font-size:12px!important}
html body .app-shell .detail-modal>p,html body .detail-modal>p{font-size:14px!important}
html body .app-shell .detail-modal .detail-grid,html body .detail-modal .detail-grid{font-size:14px!important;gap:16px!important}
html body .detail-modal .detail-grid>span,html body .app-shell .detail-modal .detail-grid>span{font-size:14px!important}
html body .detail-modal .detail-grid strong,html body .app-shell .detail-modal .detail-grid strong{font-size:14px!important;line-height:1.4}
html body #root .detail-modal :is(button,input,select,textarea,label,small,p,th,td,span,strong,div){font-size:14px!important}
html body #root .detail-modal>p,html body #root .detail-modal .detail-grid{font-size:14px!important}
html body #root .detail-modal .module-eyebrow{font-size:12px!important}
html body .detail-modal .sh-bp{border-top:1px solid #efeff4;margin-top:4px;padding-top:14px;display:grid;gap:12px}
html body .detail-modal .sh-bp-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
html body .detail-modal .sh-bp label{display:grid;gap:5px;color:#687084}
html body .detail-modal .sh-bp input,html body .detail-modal .sh-bp select{padding:9px 10px;border:1px solid #dcdce8;border-radius:8px;width:100%;box-sizing:border-box}
html body .detail-modal .sh-bp-row{display:flex;gap:8px;align-items:center;justify-content:space-between;color:#55566b}
html body .detail-modal .sh-bp-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.sh-di{display:flex;gap:6px;align-items:center;position:relative;width:100%}
.sh-di input[type=text]{flex:1;min-width:0}
.sh-di button{border:1px solid #dcdce8;background:#fff;border-radius:8px;padding:0 10px;height:100%;min-height:34px;cursor:pointer}
.sh-di input[type=date]{position:absolute;right:0;bottom:0;width:1px;height:1px;opacity:0;pointer-events:none}
@media (max-width:560px){html body .detail-modal .sh-bp-grid{grid-template-columns:1fr}}
</style>
